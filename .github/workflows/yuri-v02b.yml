name: Yuri v0.2B engine and regression checks

on:
  push:
    branches: [feature/yuri-units-economy-v0.2b]
  pull_request:
    paths:
      - 'engine/**'
      - 'tests/**'
      - '.github/workflows/yuri-v02b.yml'

permissions:
  contents: read

jobs:
  linux-yuri-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxkbcommon-dev
      - name: Fetch and verify pinned SDL2 2.30.9
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/SDL2-2.30.9.tar.gz"
          mkdir -p "$RUNNER_TEMP/sdl2-source"
          curl -fL --retry 4 --retry-all-errors --connect-timeout 20 \
            https://www.libsdl.org/release/SDL2-2.30.9.tar.gz -o "$archive"
          echo "24b574f71c87a763f50704bbb630cbe38298d544a1f890f099a4696b1d6beba4  $archive" | sha256sum -c -
          tar -xzf "$archive" --strip-components=1 -C "$RUNNER_TEMP/sdl2-source"
      - name: Configure engine
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DRA2_BUILD_ENGINE=ON \
            "-DFETCHCONTENT_SOURCE_DIR_SDL2=$RUNNER_TEMP/sdl2-source"
      - name: Build game and regression tests
        run: cmake --build build --target ra2engine ra2assets_tests --parallel 2
      - name: Execute existing asset and engine regression tests
        run: ./build/ra2assets_tests
