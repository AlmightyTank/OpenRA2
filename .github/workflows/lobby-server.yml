name: OpenRA2 multiplayer lobby server
on:
  push:
    branches:
      - feature/multiplayer-server-v0.1
    paths:
      - 'server/**'
      - '.github/workflows/lobby-server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/lobby-server.yml'
permissions:
  contents: read
jobs:
  go-test:
    name: Go tests and race detection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - name: Unit and concurrent integration tests
        run: go test -count=1 ./...
        working-directory: server
      - name: Repeated real-socket multi-match stress
        run: go test -count=5 -run TestLive ./internal/lobby
        working-directory: server
      - name: Race detector
        run: go test -race -count=1 ./...
        working-directory: server
      - name: Vet
        run: go vet ./...
        working-directory: server
      - name: Build Linux lobby daemon
        run: go build -o /tmp/ra2lobbyd ./cmd/ra2lobbyd
        working-directory: server
