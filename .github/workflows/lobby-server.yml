name: OpenRA2 multiplayer lobby server
on:
  push:
    branches:
      - feature/multiplayer-server-v0.1
      - feature/android-gamepad-v0.1
    paths:
      - 'server/**'
      - '.github/workflows/lobby-server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/lobby-server.yml'
permissions:
  contents: read
jobs:
  go-test:
    name: Go tests and race detection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - name: Unit and concurrent integration tests
        run: go test -count=1 ./...
        working-directory: server
      - name: Validate standalone dashboard JavaScript
        run: node --check server/internal/admin/static/dashboard.js
      - name: Repeated real-socket multi-match stress
        run: go test -count=5 -run TestLive ./internal/lobby
        working-directory: server
      - name: Race detector
        run: go test -race -count=1 ./...
        working-directory: server
      - name: Vet
        run: go vet ./...
        working-directory: server
      - name: Build Linux lobby daemon
        run: go build -trimpath -buildvcs=false -o /tmp/ra2lobbyd ./cmd/ra2lobbyd
        working-directory: server
      - name: Lint deploy scripts and smoke-test guarded release/rollback
        run: |
          bash -n server/deploy/release.sh server/deploy/smoke.sh
          bash server/deploy/smoke.sh /tmp/ra2lobbyd
      - name: Package release candidates with SHA-256
        run: |
          mkdir -p dist
          for target in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$target" go build \
              -trimpath -buildvcs=false -ldflags="-s -w" \
              -o "../dist/ra2lobbyd-linux-$target" ./cmd/ra2lobbyd
          done
          (cd ../dist && sha256sum ra2lobbyd-linux-* > SHA256SUMS)
        working-directory: server
      - name: Publish nonproduction release-candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ra2lobbyd-linux-candidates
          path: dist/
          retention-days: 14
          if-no-files-found: error
